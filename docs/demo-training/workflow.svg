<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="1065" viewBox="0 0 1030 1065" role="img" aria-label="商品标准化主流程"><title>商品标准化主流程</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#758994"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#173246;font-size:17px} .small{font-size:14px;fill:#526773} .title{font-size:25px;font-weight:600}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="40" class="title">商品标准化主流程</text><rect x="230" y="80" width="400" height="76" rx="10" fill="#d9eeeb" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="430" y="112">1 发布字段配置</tspan><tspan x="430" y="136" class="small">固定字段 + 所有启用动态字段</tspan></text><rect x="230" y="205" width="400" height="76" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="430" y="237">2 上传供应商 Excel</tspan><tspan x="430" y="261" class="small">保存原表与字段快照</tspan></text><rect x="230" y="330" width="400" height="76" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="430" y="362">3 识别工作表和表头</tspan><tspan x="430" y="386" class="small">多层表头 · 来源位置 · 合并范围</tspan></text><rect x="230" y="455" width="400" height="76" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="430" y="487">4 确认映射</tspan><tspan x="430" y="511" class="small">规则 / AI 建议 → 人工确认</tspan></text><rect x="230" y="580" width="400" height="76" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="430" y="612">5 维护记录并校验</tspan><tspan x="430" y="636" class="small">类型 · 必填 · 范围等已配置规则</tspan></text><rect x="230" y="755" width="400" height="76" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="430" y="787">6 创建独立导出任务</tspan><tspan x="430" y="811" class="small">冻结记录版本 · 生成前再校验</tspan></text><rect x="230" y="880" width="400" height="76" rx="10" fill="#d9eeeb" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="430" y="912">7 生成和下载</tspan><tspan x="430" y="936" class="small">标准商品表 · 生成说明 · ZIP</tspan></text><path d="M430 156V205" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M430 281V330" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M430 406V455" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M430 531V580" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M430 656V755" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="443" y="709" class="small">无阻断错误 ready</text><path d="M430 831V880" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="720" y="580" width="260" height="92" rx="10" fill="#fff0d8" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="850" y="620">修改或 Excel 回传</tspan><tspan x="850" y="644" class="small">错误仍在就继续维护</tspan></text><path d="M630 610H720" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="650" y="596" class="small">有错误</text><path d="M850 672V710H570V656" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="666" y="735" class="small">保存后重新校验</text><rect x="720" y="330" width="260" height="92" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="850" y="370">保留来源结构</tspan><tspan x="850" y="394" class="small">未匹配列 / 纵向合并关系</tspan></text><path d="M630 368H720" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="230" y="1005" class="small">task：processing → mapping → maintenance / ready → completed</text><text x="230" y="1033" class="small">export 有独立 processing / completed 状态；失败或取消另走恢复流程。</text></svg>