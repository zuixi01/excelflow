<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="730" viewBox="0 0 1080 730" role="img" aria-label="字段映射的决策过程"><title>字段映射的决策过程</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#758994"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#173246;font-size:17px} .small{font-size:14px;fill:#526773} .title{font-size:25px;font-weight:600}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="40" class="title">字段映射的决策过程</text><rect x="40" y="95" width="280" height="90" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="180" y="134">适用历史确认映射？</tspan><tspan x="180" y="158" class="small">结构与配置等签名相同才复用</tspan></text><rect x="395" y="95" width="280" height="90" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="535" y="134">名称与别名匹配</tspan><tspan x="535" y="158" class="small">唯一来源 → 规则建议</tspan></text><rect x="750" y="95" width="280" height="90" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="890" y="134">剩余目标字段</tspan><tspan x="890" y="158" class="small">配置模型时进入语义分析</tspan></text><rect x="750" y="280" width="280" height="100" rx="10" fill="#fff0d8" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="890" y="312">AI 整本工作簿请求</tspan><tspan x="890" y="336" class="small">各表未匹配目标合并一次请求</tspan><tspan x="890" y="360" class="small">仅传字段元数据与源表头</tspan></text><rect x="395" y="280" width="280" height="100" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="535" y="324">服务端严格检查</tspan><tspan x="535" y="348" class="small">字段 / 列号 / 跨表 / 类型兼容</tspan></text><rect x="40" y="280" width="280" height="100" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="180" y="324">唯一且置信度 ≥ 0.85？</tspan><tspan x="180" y="348" class="small">满足：建议；否则：人工选择</tspan></text><rect x="40" y="485" width="280" height="90" rx="10" fill="#d9eeeb" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="180" y="524">人工确认或调整</tspan><tspan x="180" y="548" class="small">包括规则建议和模型建议</tspan></text><rect x="395" y="485" width="280" height="90" rx="10" fill="#d9eeeb" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="535" y="524">确定性转换与校验</tspan><tspan x="535" y="548" class="small">取值规则 + 字段类型规则</tspan></text><rect x="750" y="485" width="280" height="90" rx="10" fill="#fff0d8" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="890" y="512">无模型 / 失败 / 低置信度</tspan><tspan x="890" y="536" class="small">列出原因与未匹配字段</tspan><tspan x="890" y="560" class="small">仍可人工处理</tspan></text><path d="M320 140H395" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="334" y="122" class="small">不适用</text><path d="M675 140H750" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="685" y="122" class="small">未匹配</text><path d="M890 185V280" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M750 330H675" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395 330H320" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M180 380V485" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="193" y="434" class="small">建议 / 手选</text><path d="M320 530H395" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M40 140H20V530H40" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="40" y="230" class="small">可复用</text><path d="M535 185V220H360V450H180V485" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="415" y="247" class="small">规则建议</text><path d="M1030 140H1055V530H1030" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M890 380V485" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="905" y="437" class="small">请求失败</text><path d="M750 551H705V625H180V575" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="462" y="650" class="small">人工补充与确认</text><text x="40" y="700" class="small">0.85 是建议使用门槛，不代表实测准确率；最终绑定需要人工确认。</text></svg>