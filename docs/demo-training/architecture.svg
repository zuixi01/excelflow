<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="815" viewBox="0 0 1080 815" role="img" aria-label="ExcelFlow 整体架构"><title>ExcelFlow 整体架构</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#758994"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#173246;font-size:17px} .small{font-size:14px;fill:#526773} .title{font-size:25px;font-weight:600}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="40" class="title">ExcelFlow 整体架构</text><rect x="375" y="80" width="300" height="74" rx="10" fill="#d9eeeb" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="525" y="111">Vue 工作台</tspan><tspan x="525" y="135" class="small">上传 · 确认 · 维护 · 下载</tspan></text><rect x="375" y="210" width="300" height="74" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="525" y="241">FastAPI 接口</tspan><tspan x="525" y="265" class="small">身份 / 权限检查 · 请求校验</tspan></text><rect x="375" y="340" width="300" height="82" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="525" y="375">后台执行与任务恢复</tspan><tspan x="525" y="399" class="small">开发：本地执行；配置队列：RQ</tspan></text><rect x="375" y="485" width="300" height="82" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="525" y="520">Python 标准化业务服务</tspan><tspan x="525" y="544" class="small">解析 · 映射 · 校验 · 版本</tspan></text><rect x="375" y="650" width="300" height="80" rx="10" fill="#d9eeeb" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="525" y="684">openpyxl 新表导出</tspan><tspan x="525" y="708" class="small">标准商品表 + 生成说明 + ZIP</tspan></text><rect x="32" y="270" width="270" height="110" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="167" y="307">SQL 数据库</tspan><tspan x="167" y="331" class="small">配置 / 任务 / 维护记录</tspan><tspan x="167" y="355" class="small">修订 / 执行租约</tspan></text><rect x="32" y="490" width="270" height="95" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="167" y="531.5">本地或共享文件目录</tspan><tspan x="167" y="555.5" class="small">原表 / 解析数据 / 维护表 / 结果</tspan></text><rect x="748" y="485" width="290" height="82" rx="10" fill="#fff0d8" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="893" y="520">可选 AI 模型</tspan><tspan x="893" y="544" class="small">未匹配字段的语义建议</tspan></text><rect x="748" y="155" width="290" height="120" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="893" y="197">通用核验的独立路径</tspan><tspan x="893" y="221" class="small">比对引擎 → 修复 Manifest</tspan><tspan x="893" y="245" class="small">→ .NET / OpenXML</tspan></text><rect x="748" y="320" width="290" height="82" rx="10" fill="#edf5f6" stroke="#d3dfe3"/><text text-anchor="middle"><tspan x="893" y="355">可选 MinIO / S3</tspan><tspan x="893" y="379" class="small">通用审计快照与产物</tspan></text><path d="M525 154V210" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="535" y="187" class="small">HTTP</text><path d="M525 284V340" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M525 422V485" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M525 567V650" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M375 246H334V325H302" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M375 526H302" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M375 526H330V365H302" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M675 526H748" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="686" y="468" class="small">表头与字段信息</text><path d="M675 246H748" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="682" y="226" class="small">另一路径</text><path d="M893 275V320" fill="none" stroke="#758994" stroke-width="1.8" marker-end="url(#arrow)"/><text x="32" y="786" class="small">主流程生成新标准表；.NET 与 MinIO 不属于每一次标准化导出的必经环节。</text></svg>