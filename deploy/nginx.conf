server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512m; # Includes multipart overhead for 500 MiB supplier uploads.
    client_body_timeout 60s;
    send_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    location /api/ {
        # Avoid holding 500 MiB bodies at the proxy before application admission.
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # The TLS edge replaces both headers. This container is reachable only
        # on the host loopback and the private Compose network.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 900s;
    }
    location /health/ { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
