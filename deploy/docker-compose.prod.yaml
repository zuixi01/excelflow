name: excel-auditor
services:
  api:
    mem_limit: ${API_MEMORY_LIMIT:-2g}
    cpus: 1.5
    group_add: ["${SECRET_READ_GID:?set SECRET_READ_GID to the group that can read model/platform keys}"]
    image: ${API_IMAGE:?set API_IMAGE to an immutable tag or digest}
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    environment:
      EXCEL_AUDITOR_ENV: production
      EXCEL_AUDITOR_DATA: /data
      TMPDIR: /data/tmp
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      EXCEL_RENDERER_COMMAND: /app/renderer/ExcelRenderer
      EXCEL_AUDITOR_CONNECTIONS: /run/excel-auditor/connections.json
      EXCEL_AUDITOR_SECRET_DIR: /run/secrets/excel-auditor
      EXCEL_AUDITOR_REQUIRE_AUTH: "1"
      EXCEL_AUDITOR_API_TOKEN: ${EXCEL_AUDITOR_API_TOKEN:?set EXCEL_AUDITOR_API_TOKEN}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      EXCEL_AUDITOR_ADMIN_USERNAME: ${EXCEL_AUDITOR_ADMIN_USERNAME:-admin}
      EXCEL_AUDITOR_ADMIN_PASSWORD: ${EXCEL_AUDITOR_ADMIN_PASSWORD:?set EXCEL_AUDITOR_ADMIN_PASSWORD}
      EXCEL_AUDITOR_MAX_WORKSPACE_RUNNING_JOBS: ${EXCEL_AUDITOR_MAX_WORKSPACE_RUNNING_JOBS:-8}
      EXCEL_AUDITOR_MAX_WORKSPACE_QUEUED_JOBS: ${EXCEL_AUDITOR_MAX_WORKSPACE_QUEUED_JOBS:-100}
      EXCEL_AUDITOR_DEFAULT_OPERATOR_MAX_RUNNING: ${EXCEL_AUDITOR_DEFAULT_OPERATOR_MAX_RUNNING:-2}
      EXCEL_AUDITOR_DEFAULT_OPERATOR_MAX_QUEUED: ${EXCEL_AUDITOR_DEFAULT_OPERATOR_MAX_QUEUED:-10}
      EXCEL_AUDITOR_DEFAULT_OPERATOR_DAILY_LIMIT: ${EXCEL_AUDITOR_DEFAULT_OPERATOR_DAILY_LIMIT:-100}
      EXCEL_AUDITOR_LEASE_SECONDS: ${EXCEL_AUDITOR_LEASE_SECONDS:-120}
      EXCEL_AUDITOR_MAX_RETRIES: ${EXCEL_AUDITOR_MAX_RETRIES:-3}
      EXCEL_AUDITOR_WORKFLOW_MAX_RUNNING: ${EXCEL_AUDITOR_WORKFLOW_MAX_RUNNING:-2}
      EXCEL_AUDITOR_WORKFLOW_MAX_WAITING: ${EXCEL_AUDITOR_WORKFLOW_MAX_WAITING:-50}
      EXCEL_AUDITOR_WORKFLOW_USER_RUNNING: ${EXCEL_AUDITOR_WORKFLOW_USER_RUNNING:-1}
      EXCEL_AUDITOR_WORKFLOW_USER_WAITING: ${EXCEL_AUDITOR_WORKFLOW_USER_WAITING:-3}
      EXCEL_AUDITOR_MAX_UPLOADS: ${EXCEL_AUDITOR_MAX_UPLOADS:-16}
      EXCEL_AUDITOR_MODEL_GLOBAL_CONCURRENCY: ${EXCEL_AUDITOR_MODEL_GLOBAL_CONCURRENCY:-4}
      EXCEL_AUDITOR_MIN_FREE_DISK_MIB: ${EXCEL_AUDITOR_MIN_FREE_DISK_MIB:-2048}
      EXCEL_AUDITOR_MODEL_KEY_FILE: /run/secrets/model-key
      EXCEL_AUDITOR_API_WORKERS: ${EXCEL_AUDITOR_API_WORKERS:-2}
      EXCEL_AUDITOR_TRUSTED_PROXY_IPS: ${EXCEL_AUDITOR_TRUSTED_PROXY_IPS:?set EXCEL_AUDITOR_TRUSTED_PROXY_IPS for the private proxy network}
      EXCEL_AUDITOR_PLATFORM_KEY_FILE: /run/secrets/platform-key
      SSL_CERT_FILE: /run/secrets/service-ca.pem
      AWS_CA_BUNDLE: /run/secrets/service-ca.pem
      PGSSLROOTCERT: /run/secrets/service-ca.pem
      EXCEL_AUDITOR_MAPPING_CONCURRENCY: ${EXCEL_AUDITOR_MAPPING_CONCURRENCY:-4}
      EXCEL_AUDITOR_MAPPING_TASK_CONCURRENCY: ${EXCEL_AUDITOR_MAPPING_TASK_CONCURRENCY:-2}
    volumes:
      - auditor-data:/data
      - ${MODEL_KEY_FILE:?set MODEL_KEY_FILE}:/run/secrets/model-key:ro
      - ${PLATFORM_KEY_FILE:?set PLATFORM_KEY_FILE}:/run/secrets/platform-key:ro
      - ${SERVICE_CA_FILE:?set SERVICE_CA_FILE}:/run/secrets/service-ca.pem:ro
      - ${STANDARD_CONNECTIONS_FILE:-./connections.empty.json}:/run/excel-auditor/connections.json:ro
      - ${STANDARD_SECRETS_DIR:-./standard-secrets.empty}:/run/secrets/excel-auditor:ro
    restart: unless-stopped
  worker: &worker-base
    profiles: [legacy]
    depends_on:
      api:
        condition: service_healthy
    image: ${API_IMAGE:?set API_IMAGE to an immutable tag or digest}
    group_add: ["${SECRET_READ_GID:?set SECRET_READ_GID to the group that can read model/platform keys}"]
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    command: ["excel-auditor-worker"]
    environment: &worker-environment
      EXCEL_AUDITOR_ENV: production
      EXCEL_AUDITOR_DATA: /data
      TMPDIR: /data/tmp
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      EXCEL_RENDERER_COMMAND: /app/renderer/ExcelRenderer
      EXCEL_AUDITOR_CONNECTIONS: /run/excel-auditor/connections.json
      EXCEL_AUDITOR_SECRET_DIR: /run/secrets/excel-auditor
      EXCEL_AUDITOR_REQUIRE_AUTH: "1"
      EXCEL_AUDITOR_API_TOKEN: ${EXCEL_AUDITOR_API_TOKEN:?set EXCEL_AUDITOR_API_TOKEN}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      EXCEL_AUDITOR_QUEUE_NAME: normal
      EXCEL_AUDITOR_WORKER_ID: ${HOSTNAME:-worker-normal}
      EXCEL_AUDITOR_LEASE_SECONDS: ${EXCEL_AUDITOR_LEASE_SECONDS:-120}
      EXCEL_AUDITOR_MAX_RETRIES: ${EXCEL_AUDITOR_MAX_RETRIES:-3}
      EXCEL_AUDITOR_WORKFLOW_MAX_RUNNING: ${EXCEL_AUDITOR_WORKFLOW_MAX_RUNNING:-2}
      EXCEL_AUDITOR_WORKFLOW_MAX_WAITING: ${EXCEL_AUDITOR_WORKFLOW_MAX_WAITING:-50}
      EXCEL_AUDITOR_WORKFLOW_USER_RUNNING: ${EXCEL_AUDITOR_WORKFLOW_USER_RUNNING:-1}
      EXCEL_AUDITOR_WORKFLOW_USER_WAITING: ${EXCEL_AUDITOR_WORKFLOW_USER_WAITING:-3}
      EXCEL_AUDITOR_MAX_UPLOADS: ${EXCEL_AUDITOR_MAX_UPLOADS:-16}
      EXCEL_AUDITOR_MODEL_GLOBAL_CONCURRENCY: ${EXCEL_AUDITOR_MODEL_GLOBAL_CONCURRENCY:-4}
      EXCEL_AUDITOR_MIN_FREE_DISK_MIB: ${EXCEL_AUDITOR_MIN_FREE_DISK_MIB:-2048}
      EXCEL_AUDITOR_MODEL_KEY_FILE: /run/secrets/model-key
      EXCEL_AUDITOR_PLATFORM_KEY_FILE: /run/secrets/platform-key
      SSL_CERT_FILE: /run/secrets/service-ca.pem
      AWS_CA_BUNDLE: /run/secrets/service-ca.pem
      PGSSLROOTCERT: /run/secrets/service-ca.pem
      EXCEL_AUDITOR_MAPPING_CONCURRENCY: ${EXCEL_AUDITOR_MAPPING_CONCURRENCY:-4}
      EXCEL_AUDITOR_MAPPING_TASK_CONCURRENCY: ${EXCEL_AUDITOR_MAPPING_TASK_CONCURRENCY:-2}
    volumes:
      - auditor-data:/data
      - ${MODEL_KEY_FILE:?set MODEL_KEY_FILE}:/run/secrets/model-key:ro
      - ${PLATFORM_KEY_FILE:?set PLATFORM_KEY_FILE}:/run/secrets/platform-key:ro
      - ${SERVICE_CA_FILE:?set SERVICE_CA_FILE}:/run/secrets/service-ca.pem:ro
      - ${STANDARD_CONNECTIONS_FILE:-./connections.empty.json}:/run/excel-auditor/connections.json:ro
      - ${STANDARD_SECRETS_DIR:-./standard-secrets.empty}:/run/secrets/excel-auditor:ro
    healthcheck:
      test: ["CMD", "python", "-m", "excel_auditor.worker_health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      replicas: ${NORMAL_WORKER_REPLICAS:-4}
  worker-heavy:
    extends:
      service: worker
    environment:
      EXCEL_AUDITOR_QUEUE_NAME: heavy
      EXCEL_AUDITOR_WORKER_ID: worker-heavy
    deploy:
      replicas: ${HEAVY_WORKER_REPLICAS:-2}
  worker-network:
    extends:
      service: worker
    environment:
      EXCEL_AUDITOR_QUEUE_NAME: network
      EXCEL_AUDITOR_WORKER_ID: worker-network
    deploy:
      replicas: ${NETWORK_WORKER_REPLICAS:-2}
  worker-workflow:
    profiles: []
    mem_limit: ${IMPORT_MEMORY_LIMIT:-4g}
    cpus: 2
    <<: *worker-base
    environment:
      <<: *worker-environment
      EXCEL_AUDITOR_QUEUE_NAME: workflow
      EXCEL_AUDITOR_WORKER_ID: worker-workflow
    deploy:
      replicas: ${WORKFLOW_WORKER_REPLICAS:-1}
  worker-workflow-export:
    profiles: []
    mem_limit: ${EXPORT_MEMORY_LIMIT:-4g}
    cpus: 2
    <<: *worker-base
    environment:
      <<: *worker-environment
      EXCEL_AUDITOR_QUEUE_NAME: workflow-export
      EXCEL_AUDITOR_WORKER_ID: worker-workflow-export
    deploy:
      replicas: ${WORKFLOW_EXPORT_WORKER_REPLICAS:-1}
  workflow-recovery:
    profiles: []
    mem_limit: 512m
    cpus: 0.5
    <<: *worker-base
    command: ["python", "-m", "excel_auditor.workflow.execution"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; from pathlib import Path; p=Path(os.environ['EXCEL_AUDITOR_DATA'])/'workflow/recovery.heartbeat'; assert time.time()-p.stat().st_mtime<100"]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: 1
  web:
    mem_limit: 128m
    image: ${WEB_IMAGE:?set WEB_IMAGE to an immutable tag or digest}
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    restart: unless-stopped
volumes:
  auditor-data:
