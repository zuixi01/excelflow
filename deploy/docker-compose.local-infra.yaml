name: excelflow-local-infra

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: excel_auditor
      POSTGRES_USER: excel_auditor
      POSTGRES_PASSWORD: ${EXCELFLOW_LOCAL_PG_PASSWORD:?Set EXCELFLOW_LOCAL_PG_PASSWORD in var/local-infra.env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excel_auditor -d excel_auditor"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
